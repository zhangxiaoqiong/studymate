name: "✨ Feature Request"
description: "建议一个新功能"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请详细描述你想要的功能。

  - type: textarea
    id: description
    attributes:
      label: "功能描述"
      description: "清楚地描述你建议的功能"
      placeholder: "例如：添加支持从 URL 导入文档的功能..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "解决的问题"
      description: "这个功能解决什么问题或改进什么体验？"
      placeholder: "例如：目前只能上传本地文件，无法直接分析网页内容..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "建议的解决方案"
      description: "你建议如何实现这个功能？"
      placeholder: "例如：添加一个 URL 输入框，验证 URL 后获取页面内容..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "可选的替代方案"
      description: "你想过其他实现方式吗？"

  - type: textarea
    id: additional
    attributes:
      label: "其他信息"
      description: "添加任何其他信息、截图、参考链接等"

  - type: checkboxes
    id: checklist
    attributes:
      label: "检查清单"
      options:
        - label: "我已查看现有 Issues，确认这不是重复建议"
          required: true
        - label: "这个功能与项目的目标相符"
          required: true
