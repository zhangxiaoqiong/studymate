name: Python Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov flake8

    - name: Lint with flake8
      run: |
        # 检查语法错误和未定义的名称（排除备份文件）
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics --ignore=F821,F823,F824 --exclude=*_backup.py
        # 检查代码风格（排除备份文件）
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics --exclude=*_backup.py

    - name: Run tests with pytest
      run: |
        if [ -d "backend/tests" ]; then
          pytest backend/tests --cov=backend --cov-report=xml --cov-report=html
        else
          echo "No tests directory found, skipping tests"
          mkdir -p coverage
          echo "<?xml version=\"1.0\" ?><coverage version=\"5.5\"></coverage>" > coverage.xml
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Bandit security check
      run: |
        pip install bandit
        bandit -r backend -ll -f json -o bandit-report.json || true
